name: Validate RaceDay Part 1

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required docs folder
        run: |
          test -d docs

      - name: Check required ERD
        run: |
          test -f docs/RaceDay_ERD.png

      - name: Check required API Endpoint Plan
        run: |
          test -f docs/RaceDay_API_Endpoint_Plan.pdf

      - name: Check required SQL script
        run: |
          test -f docs/RaceDay_Database.sql

      - name: Validate Part 1 files
        run: |
          echo "RaceDay Part 1 documentation files found successfully."
