name: RaceDay CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    name: Build, test and build Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Part3/RaceDay-Full.sln

      - name: Build
        run: dotnet build Part3/RaceDay-Full.sln --configuration Release --no-restore

      - name: Run unit tests (API and MVC)
        run: dotnet test Part3/RaceDay-Full.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"

      - name: Build API Docker image
        run: docker build -f Part2-API/Dockerfile -t raceday-api .

      - name: Build MVC Docker image
        run: docker build -f Part3/Part3-MVC/Dockerfile -t raceday-mvc .
