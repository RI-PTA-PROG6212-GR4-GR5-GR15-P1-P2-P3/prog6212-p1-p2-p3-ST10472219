name: RaceDay CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    name: Build, test and build Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Part3/RaceDay-Full.sln

      - name: Build
        run: dotnet build Part3/RaceDay-Full.sln --configuration Release --no-restore

      - name: Run unit tests (API and MVC)
        run: dotnet test Part3/RaceDay-Full.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"

      - name: Build API Docker image
        run: docker build -f Part2-API/Dockerfile -t raceday-api .

      - name: Build MVC Docker image
        run: docker build -f Part3/Part3-MVC/Dockerfile -t raceday-mvc .

      # Same steps as the README: copy .env, then docker compose up (SQL Server, Azurite, API and MVC).
      - name: Run the app with Docker compose
        working-directory: Part3
        run: |
          cp .env.example .env
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8081/api/events > /dev/null && curl -fs http://localhost:8080/ > /dev/null; then
              echo "API and MVC are running"; break
            fi
            sleep 5
          done
          docker compose ps

      - name: Check the running containers
        run: |
          curl -fs http://localhost:8081/api/events > /dev/null
          curl -fs http://localhost:8080/ | grep -q "RaceDay"
          curl -fs -c jar.txt -H "Content-Type: application/json" \
            -d '{"fullName":"CI Check","email":"ci.check@example.com","password":"CiCheck2026!"}' \
            http://localhost:8081/api/auth/register/participant > /dev/null
          curl -fs -c jar.txt -b jar.txt -H "Content-Type: application/json" \
            -d '{"email":"ci.check@example.com","password":"CiCheck2026!"}' http://localhost:8081/api/auth/login > /dev/null
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > pic.png
          curl -fs -b jar.txt -F "file=@pic.png;type=image/png" http://localhost:8081/api/profile/picture > /dev/null
          curl -fs -b jar.txt -o back.png http://localhost:8081/api/profile/picture
          cmp pic.png back.png
          echo "Database, blob storage (Azurite), API and MVC all work in Docker"

      - name: Show container logs if something failed
        if: failure()
        working-directory: Part3
        run: docker compose logs

      - name: Stop the containers
        if: always()
        working-directory: Part3
        run: docker compose down -v
